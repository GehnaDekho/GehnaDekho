version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gehnadekho-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    # If your app requires MongoDB or other services, you can add them below and link them.
